# Local development stack: fabric + PostgreSQL + an OIDC provider that plays
# both the workload issuer and the enterprise admin IdP, + an OTel collector.
# Uses in-memory signing keys (FABRIC_DEV_EPHEMERAL_KEYS); never use this
# configuration outside a developer workstation.
name: agent-identity-fabric

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: fabric
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: fabric-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric -d fabric"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports:
      - "8081:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  fabric:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      oidc:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      FABRIC_ENVIRONMENT: development
      FABRIC_DEV_EPHEMERAL_KEYS: "true"
      FABRIC_TRUST_DOMAIN: agents.local
      FABRIC_ISSUER: http://localhost:8080
      FABRIC_DATABASE_URL: postgresql+asyncpg://fabric:fabric-local-only@postgres:5432/fabric
      FABRIC_WORKLOAD_ISSUERS: '{"http://oidc:8080/workload": "http://oidc:8080/workload/jwks"}'
      FABRIC_ADMIN_ISSUER: http://oidc:8080/admin
      FABRIC_ADMIN_AUDIENCE: identity-fabric-admin
      FABRIC_ADMIN_JWKS_URL: http://oidc:8080/admin/jwks
      FABRIC_AUDIT_LOG_PATH: /var/lib/identity-fabric/audit/audit.jsonl
      FABRIC_OTLP_ENDPOINT: http://otel-collector:4317
      FABRIC_LOG_LEVEL: DEBUG

volumes:
  pgdata:
