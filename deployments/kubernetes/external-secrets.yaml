# Syncs fabric secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-identity-fabric-database
  namespace: agent-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-identity-fabric-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: agent-identity-fabric-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-identity-fabric-signing-keys
  namespace: agent-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-identity-fabric-signing-keys
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^agent-identity-fabric-signing-key-"
      rewrite:
        - regexp:
            source: "^agent-identity-fabric-signing-key-(.*)$"
            target: "$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-identity-fabric-audit-key
  namespace: agent-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-identity-fabric-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^agent-identity-fabric-audit-key-"
      rewrite:
        - regexp:
            source: "^agent-identity-fabric-audit-key-(.*)$"
            target: "audit-$1.pem"
